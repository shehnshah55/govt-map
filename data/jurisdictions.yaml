# Territorial units. Divisions and districts are generated from the compact
# `field_administration` blocks below by scripts/build-data.ts, which also
# creates each Divisional Commissioner / Deputy Commissioner office and post.
jurisdictions:
  - id: pk
    name: Islamic Republic of Pakistan
    name_ur: اسلامی جمہوریہ پاکستان
    kind: country
    capital: Islamabad
  - id: pk-ict
    name: Islamabad Capital Territory
    name_ur: اسلام آباد وفاقی دارالحکومت
    kind: federal_capital
    parent: pk
    capital: Islamabad
    local_government_law: ict-lg-act-2015
    notes: Administered directly by the Federal Government (Ministry of Interior) through the Chief Commissioner and Deputy Commissioner, Islamabad; Islamabad Metropolitan Corporation and the Capital Development Authority provide municipal services.
  - id: pk-pb
    name: Punjab
    name_ur: پنجاب
    kind: province
    parent: pk
    capital: Lahore
    local_government_law: punjab-lg-act-2022
  - id: pk-sd
    name: Sindh
    name_ur: سندھ
    kind: province
    parent: pk
    capital: Karachi
    local_government_law: sindh-lg-act-2013
  - id: pk-kp
    name: Khyber Pakhtunkhwa
    name_ur: خیبر پختونخوا
    kind: province
    parent: pk
    capital: Peshawar
    local_government_law: kp-lg-act-2013
    notes: Includes the former Federally Administered Tribal Areas, merged by the 25th Amendment (2018) and now organised as tribal districts.
  - id: pk-ba
    name: Balochistan
    name_ur: بلوچستان
    kind: province
    parent: pk
    capital: Quetta
    local_government_law: balochistan-lg-act-2010
  - id: pk-gb
    name: Gilgit-Baltistan
    name_ur: گلگت بلتستان
    kind: special_territory
    parent: pk
    capital: Gilgit
    notes: Administered under the Government of Gilgit-Baltistan Order, 2018; federal coordination through the Ministry of Kashmir Affairs and Gilgit-Baltistan. Not a province under Art. 1 of the Constitution.
  - id: pk-ajk
    name: Azad Jammu and Kashmir
    name_ur: آزاد جموں و کشمیر
    kind: special_territory
    parent: pk
    capital: Muzaffarabad
    notes: Self-governing territory under the AJK Interim Constitution, 1974, with its own President, Prime Minister, Legislative Assembly and superior judiciary. Shown here because the Federal Government has constitutional and administrative links to it (Ministry of Kashmir Affairs and Gilgit-Baltistan); its status is governed by the Kashmir dispute and UN resolutions.

