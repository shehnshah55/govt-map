# Federal attached departments, autonomous bodies, regulators and state-owned
# enterprises. `parent` is the Division/Ministry exercising administrative
# control (Rules of Business 1973, Schedule III for attached departments).
# Statutory regulators are independent in their decisions; their `parent` is the
# administrative link only.
