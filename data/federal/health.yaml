  - id: fed-szabmu
    name: Shaheed Zulfiqar Ali Bhutto Medical University
    short_name: SZABMU
    kind: university
    parent: fed-min-nhsrc
    jurisdiction: pk-ict
    legal_basis: [{ law: szabmu-act-2013 }]
