    org: fed-pmdc
    role: head
    appointment: { method: indirect_election, by: fed-pmdc, legal_basis: [{ law: pmdc-act-2022 }] }
    confidence: medium
  - id: fed-pmdc-registrar
    title: Registrar, PMDC
    org: fed-pmdc
    role: administrative_head
    appointment: { method: appointment, by: fed-pmdc }
  - id: fed-nih-ed
    title: Executive Director, National Institute of Health
    org: fed-nih
    role: head
    appointment: { method: appointment, by: fed-federation, legal_basis: [{ law: nih-ordinance-1980 }] }
  - id: fed-hsa-vc
    title: Vice-Chancellor, Health Services Academy
    org: fed-hsa
    role: head
    appointment: { method: appointment, by: fed-prime-minister }
    confidence: medium
  - id: fed-ihra-ceo
    title: Chief Executive Officer, IHRA
    org: fed-ihra
    role: head
    appointment: { method: appointment, by: fed-federation, legal_basis: [{ law: ihra-act-2018 }] }
    confidence: medium
  - id: fed-neoc-coordinator
    title: National Coordinator, National Emergency Operations Centre (Polio)
    org: fed-neoc
    role: head
    appointment: { method: appointment, by: fed-min-nhsrc }
  - id: fed-pm-focal-polio
    title: Prime Minister's Focal Person for Polio Eradication
    org: fed-neoc
    role: officer
    appointment: { method: appointment, by: fed-prime-minister }
    confidence: medium
  - id: fed-pims-ed
