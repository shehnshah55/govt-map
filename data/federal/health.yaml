positions:
  - id: fed-min-nhsrc-minister
    title: Federal Minister for National Health Services, Regulations and Coordination
    org: fed-min-nhsrc
    role: head
    appointment:
      method: appointment_on_advice
      by: fed-president
      on_advice_of: fed-prime-minister
      legal_basis: [{ law: constitution-1973, provision: "Art. 92" }]
  - id: fed-min-nhsrc-secretary
    title: Secretary, Ministry of National Health Services, Regulations and Coordination
    org: fed-min-nhsrc
    role: administrative_head
    grade: BS-22
    appointment:
      method: posting
      by: fed-prime-minister
      nominated_by: fed-establishment-division
      legal_basis: [{ law: rules-of-business-1973 }, { law: civil-servants-act-1973 }]
  - id: fed-nhsrc-dg-health
    title: Director General (Health)
    org: fed-nhsrc-health-wing
    role: head
    grade: BS-21/22
    appointment: { method: posting, by: fed-min-nhsrc-secretary }
    confidence: medium
  - id: fed-imhpf-chair
    title: Chair, Inter-Ministerial Health and Population Forum
    org: fed-imhpf
    role: head
    ex_officio_of: fed-min-nhsrc-minister
    appointment: { method: ex_officio }
    confidence: medium
  - id: fed-drap-ceo
