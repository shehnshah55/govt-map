# Flagship vertical: the Ministry of National Health Services, Regulations and
# Coordination (NHSR&C) — Pakistan's counterpart of the US Department of Health
# and Human Services — with its regulators, statutory councils, institutes,
# national programmes, Islamabad hospitals and parliamentary oversight.
# Provincial health departments (where most health delivery sits after the
# 18th Amendment) are in data/provinces/*.yaml and linked below.
defaults:
  organizations:
    branch: executive
    jurisdiction: pk
    sectors: [health]

organizations:
  - id: fed-min-health-former
    name: Ministry of Health (1947–2011)
    kind: ministry
    description: The pre-devolution federal Ministry of Health, abolished on 30 June 2011 under the 18th Amendment. Its functions went to the provinces; residual federal functions were later regrouped under the Ministry of National Regulations and Services (2011) and then NHSR&C (2013).
    abolished: "2011-06-30"
    legal_basis: [{ law: amendment-18 }]
    tags: [historical]

  # ── Ministry wings ─────────────────────────────────────────────────────────
  - id: fed-nhsrc-health-wing
    name: Health Wing (Directorate General Health)
    kind: other
    parent: fed-min-nhsrc
    description: Technical wing headed by the Director General (Health); leads health policy, planning, disease-control programmes and coordination with provinces and development partners.
    needs_source: true
    confidence: low
  - id: fed-nhsrc-population-wing
    name: Population Programme Wing
    kind: other
    parent: fed-min-nhsrc
    sectors: [health, population]
    description: Federal coordination of population welfare after devolution (the Ministry of Population Welfare was devolved in 2011); reporting on FP2030 and CCI decisions on population (2018 Council of Common Interests recommendations).
    confidence: low
    sources:
      - { title: "Ministry of NHSR&C — Year Book 2018-19, ch. 24: Population Programme Wing (PPW)", url: "https://www.nhsrc.gov.pk/SiteImage/Misc/files/Year%20Book%202018-19(3).pdf", accessed: "2026-10-21", fetched_via: direct }
  - id: fed-nhsrc-hpsiu
    name: Health Planning, System Strengthening and Information Analysis Unit
    short_name: HPSIU
    kind: other
    parent: fed-min-nhsrc
    description: Planning and health-information unit supporting national health strategy, UHC benefit-package design and the District Health Information System.
    confidence: low
    sources:
      - { title: "Ministry of NHSR&C — Year Book 2018-19, ch. 19: Health Planning Systems Strengthening and Information Analysis Unit (HPSIU)", url: "https://www.nhsrc.gov.pk/SiteImage/Misc/files/Year%20Book%202018-19(3).pdf", accessed: "2026-10-21", fetched_via: direct }
  - id: fed-imhpf
    name: Inter-Ministerial Health and Population Forum
    short_name: IMHPF
    kind: intergovernmental_forum
    parent: fed-min-nhsrc
    description: Forum chaired by the Federal Health Minister with the provincial and area health and population ministers, used to agree national health policy, the National Health Vision and joint positions after devolution.
    confidence: low
    needs_source: true

  # ── Regulators and statutory councils ──────────────────────────────────────
  - id: fed-drap
    name: Drug Regulatory Authority of Pakistan
    short_name: DRAP
    name_ur: ڈرگ ریگولیٹری اتھارٹی آف پاکستان
    kind: regulator
    parent: fed-min-nhsrc
    established: "2012"
    legal_basis: [{ law: drap-act-2012 }, { law: drugs-act-1976 }]
    website: https://www.dra.gov.pk
    description: Regulates the manufacture, import, export, registration, pricing, storage, distribution and sale of drugs, biologicals, medical devices and alternative medicines. Established after devolution to keep a single national drug regulator.
    functions:
      - Registration of drugs and medical devices (Registration Board)
      - Licensing of manufacturers (Central Licensing Board)
      - Drug pricing (Drug Pricing Committee under the Drug Pricing Policy)
      - Pharmacovigilance and quality control (Central Drugs Laboratory, Karachi; federal drug testing labs)
    sources: [{ title: DRAP Act 2012, url: https://www.dra.gov.pk }]
  - id: fed-drap-policy-board
    name: DRAP Policy Board
    kind: committee
    parent: fed-drap
    legal_basis: [{ law: drap-act-2012 }]
    description: Governing board of DRAP; takes policy decisions and oversees the Authority's divisions.
  - id: fed-drap-registration-board
    name: DRAP Registration Board
    kind: committee
    parent: fed-drap
    legal_basis: [{ law: drugs-act-1976 }]
  - id: fed-drap-central-licensing-board
    name: DRAP Central Licensing Board
    kind: committee
    parent: fed-drap
    legal_basis: [{ law: drugs-act-1976 }]
  - id: fed-drap-pricing-committee
    name: Drug Pricing Committee
    kind: committee
    parent: fed-drap
    description: Recommends maximum retail prices of drugs to the Federal Government under the Drug Pricing Policy.
    confidence: low
    sources:
      - { title: "Ministry of NHSR&C — Year Book 2018-19, ch. 2 (DRAP): Drugs Pricing Committee constituted vide S.R.O. 707(I)/2013", url: "https://www.nhsrc.gov.pk/SiteImage/Misc/files/Year%20Book%202018-19(3).pdf", accessed: "2026-10-21", fetched_via: direct }
  - id: fed-central-drugs-lab
    name: Central Drugs Laboratory, Karachi
    kind: research_institute
    parent: fed-drap
    jurisdiction: pk-sd
    description: National quality-control laboratory for testing of drugs.
    confidence: low
    sources:
      - { title: "Ministry of NHSR&C — Year Book 2018-19: Central Drug Laboratory, DRAP, Sindhi Muslim Housing Society, Karachi", url: "https://www.nhsrc.gov.pk/SiteImage/Misc/files/Year%20Book%202018-19(3).pdf", accessed: "2026-10-21", fetched_via: direct }

  - id: fed-pmdc
    name: Pakistan Medical and Dental Council
    short_name: PMDC
    name_ur: پاکستان میڈیکل اینڈ ڈینٹل کونسل
    kind: statutory_council
    parent: fed-min-nhsrc
    legal_basis: [{ law: pmdc-act-2022 }]
    website: https://pmdc.pk
    description: Registers and licenses doctors and dentists, sets standards for undergraduate and postgraduate medical and dental education, recognises colleges and conducts the national licensing examination. Restored in 2022–23 after the Pakistan Medical Commission (2020–2022) was dissolved.
    confidence: medium
  - id: fed-pnmc
    name: Pakistan Nursing and Midwifery Council
    short_name: PNMC
    head_title: President, Pakistan Nursing and Midwifery Council
    kind: statutory_council
    parent: fed-min-nhsrc
    legal_basis: [{ law: pnmc-act-2023 }]
    description: Registers nurses, midwives and lady health visitors and regulates nursing education.
    confidence: medium
  - id: fed-pcp
    name: Pharmacy Council of Pakistan
    short_name: PCP
    head_title: Chairman, Pharmacy Council of Pakistan
    kind: statutory_council
    parent: fed-min-nhsrc
    legal_basis: [{ law: pharmacy-act-1967 }]
    description: Regulates pharmacy education and registration of pharmacists; provincial pharmacy councils register practitioners.
  - id: fed-nct
    name: National Council for Tibb
    short_name: NCT
    head_title: President, National Council for Tibb
    kind: statutory_council
    parent: fed-min-nhsrc
    legal_basis: [{ law: uah-practitioners-act-1965 }]
    description: Registers practitioners and regulates education in Unani (Tibb) and Ayurvedic medicine.
  - id: fed-nch
    name: National Council for Homoeopathy
    short_name: NCH
    head_title: President, National Council for Homoeopathy
    kind: statutory_council
    parent: fed-min-nhsrc
    legal_basis: [{ law: uah-practitioners-act-1965 }]
  - id: fed-ihra
    name: Islamabad Healthcare Regulatory Authority
    short_name: IHRA
    kind: regulator
    parent: fed-min-nhsrc
    jurisdiction: pk-ict
    legal_basis: [{ law: ihra-act-2018 }]
    description: Licenses and regulates public and private healthcare establishments in the Islamabad Capital Territory; the ICT counterpart of the provincial healthcare commissions.
    confidence: medium

  # ── Institutes and academies ───────────────────────────────────────────────
  - id: fed-nih
    name: National Institute of Health, Islamabad
    short_name: NIH
    name_ur: قومی ادارہ صحت
    kind: research_institute
    parent: fed-min-nhsrc
    established: "1967"
    legal_basis: [{ law: nih-ordinance-1980 }]
    website: https://www.nih.org.pk
    description: National public-health institute — disease surveillance and outbreak response, reference laboratories, the Field Epidemiology and Laboratory Training Programme, and production of vaccines, sera and diagnostic reagents. Functions as Pakistan's national centre for disease control and IHR focal point.
  - id: fed-nih-cdc
    name: Centre for Disease Control, NIH
    kind: programme
    parent: fed-nih
    description: Integrated disease surveillance and response, public health laboratories and the national IHR (2005) focal point.
    sources:
      - title: "National Institutes of Health, Islamabad (Center for Disease Control)"
        url: "https://www.nih.org.pk/"
        accessed: "2026-10-21"
  - id: fed-hsa
    name: Health Services Academy
    short_name: HSA
    kind: university
    parent: fed-min-nhsrc
    legal_basis: [{ law: hsa-ordinance-2002 }]
    website: https://www.hsa.edu.pk
    sectors: [health, education]
    description: Public-health degree-awarding institute in Islamabad; trains health managers and public-health professionals.
  - id: fed-phrc
    name: Pakistan Health Research Council
    short_name: PHRC
    kind: research_institute
    parent: fed-min-nhsrc
    website: https://www.phrc.org.pk
    sectors: [health, science]
    description: Promotes, organises and coordinates health research; hosts the National Bioethics Committee secretariat.
  - id: fed-national-bioethics-committee
    name: National Bioethics Committee
    short_name: NBC
    kind: committee
    parent: fed-phrc
    description: Reviews national-level research involving human subjects.
    confidence: low
    sources:
      - { title: "Ministry of NHSR&C — Year Book 2018-19, ch. 4 (PHRC): PHRC is the secretariat for the National Bioethics Committee", url: "https://www.nhsrc.gov.pk/SiteImage/Misc/files/Year%20Book%202018-19(3).pdf", accessed: "2026-10-21", fetched_via: direct }
  - id: fed-nips
    name: National Institute of Population Studies
    short_name: NIPS
    kind: research_institute
    parent: fed-min-nhsrc
    sectors: [health, population]
    description: Conducts the Pakistan Demographic and Health Survey (PDHS) and population research.
    confidence: medium
    website: "https://nips.org.pk/"

  # ── National programmes ────────────────────────────────────────────────────
  - id: fed-epi
    name: Federal Directorate of Immunization (Expanded Programme on Immunization)
    short_name: EPI
    kind: programme
    parent: fed-min-nhsrc
    description: Procures vaccines (with GAVI co-financing) and sets national immunization policy; provincial EPI cells deliver routine immunization.
  - id: fed-neoc
    name: National Emergency Operations Centre for Polio Eradication
    short_name: NEOC
    kind: programme
    parent: fed-min-nhsrc
    description: Coordinates the Pakistan Polio Eradication Programme with the provincial Emergency Operations Centres, WHO, UNICEF and partners. Pakistan and Afghanistan are the last countries with endemic wild poliovirus.
    website: https://www.endpolio.com.pk
  - id: fed-cmu
    name: Common Management Unit for AIDS, TB and Malaria
    short_name: CMU
    kind: programme
    parent: fed-min-nhsrc
    description: Principal recipient/manager of Global Fund grants; hosts the national TB, HIV/AIDS and malaria control programmes.
    website: "https://www.cmu.gov.pk/"
  - id: fed-nacp
    name: National AIDS Control Programme
    kind: programme
    parent: fed-cmu
    confidence: low
    sources:
      - { title: "Ministry of NHSR&C — Year Book 2018-19, ch. 22: National AIDS Control Programme (NACP)", url: "https://www.nhsrc.gov.pk/SiteImage/Misc/files/Year%20Book%202018-19(3).pdf", accessed: "2026-10-21", fetched_via: direct }
  - id: fed-ntp
    name: National TB Control Programme
    kind: programme
    parent: fed-cmu
    confidence: low
    sources:
      - { title: "Ministry of NHSR&C — Year Book 2018-19, ch. 23: National Tuberculosis Control Programme (NTP)", url: "https://www.nhsrc.gov.pk/SiteImage/Misc/files/Year%20Book%202018-19(3).pdf", accessed: "2026-10-21", fetched_via: direct }
  - id: fed-malaria-directorate
    name: Directorate of Malaria Control
    kind: programme
    parent: fed-cmu
    confidence: low
    sources:
      - { title: "Ministry of NHSR&C — Year Book 2018-19, ch. 13: Directorate of Malaria Control (DMC)", url: "https://www.nhsrc.gov.pk/SiteImage/Misc/files/Year%20Book%202018-19(3).pdf", accessed: "2026-10-21", fetched_via: direct }
  - id: fed-nutrition-wing
    name: Nutrition Wing
    kind: programme
    parent: fed-min-nhsrc
    description: National nutrition coordination (Scaling Up Nutrition focal point).
    confidence: low
    sources:
      - { title: "Ministry of NHSR&C — Year Book 2018-19: Nutrition Wing, Ministry of Health", url: "https://www.nhsrc.gov.pk/SiteImage/Misc/files/Year%20Book%202018-19(3).pdf", accessed: "2026-10-21", fetched_via: direct }
  - id: fed-sehat-sahulat
    name: Sehat Sahulat Programme (Prime Minister's National Health Programme)
    short_name: SSP
    kind: programme
    parent: fed-min-nhsrc
    website: https://sehatsahulat.gov.pk
    sectors: [health, social_protection]
    description: Federal social health-insurance programme providing families (identified via NADRA/BISP data) with a card for free in-patient treatment at empanelled hospitals; implemented through State Life Insurance Corporation. Coverage in the provinces is largely run through provincial schemes (e.g. KP Sehat Card Plus, Punjab's health card).
  - id: fed-border-health
    name: Border Health Services Pakistan
    short_name: BHS-P
    kind: attached_department
    parent: fed-min-nhsrc
    description: Port, airport and land-border health (formerly the Directorate of Central Health Establishments); implements International Health Regulations points of entry.
    confidence: low
    needs_source: true
  - id: fed-nheprn
    name: National Health Emergency Preparedness and Response Network
    short_name: NHEPRN
    kind: programme
    parent: fed-min-nhsrc
    sectors: [health, disaster]
    confidence: low
    sources:
      - { title: "Ministry of NHSR&C — Year Book 2018-19, ch. 16: National Health Emergency Preparedness & Response Network (NHEPRN)", url: "https://www.nhsrc.gov.pk/SiteImage/Misc/files/Year%20Book%202018-19(3).pdf", accessed: "2026-10-21", fetched_via: direct }

