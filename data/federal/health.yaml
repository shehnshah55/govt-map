    confidence: medium
  - id: fed-pims
    name: Pakistan Institute of Medical Sciences
    short_name: PIMS
    kind: hospital
    parent: fed-min-nhsrc
    jurisdiction: pk-ict
    website: https://pims.gov.pk
    description: Largest federal tertiary-care teaching hospital in Islamabad.
  - id: fed-polyclinic
