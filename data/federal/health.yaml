relations:
  - { from: fed-na-sc-health, to: fed-min-nhsrc, type: oversees, description: "Examines the Ministry's expenditure, administration, delegated legislation and policies (NA Rules of Procedure)" }
  - { from: fed-senate-sc-health, to: fed-min-nhsrc, type: oversees }
  - { from: fed-agp, to: fed-min-nhsrc, type: audits }
  - { from: fed-min-nhsrc, to: fed-national-assembly, type: accountable_to }
  - { from: fed-drap, to: fed-min-nhsrc, type: reports_to }
  - { from: fed-drap, to: fed-federation, type: regulates, description: "Nationwide regulation of therapeutic goods" }
  - { from: fed-pmdc, to: fed-min-nhsrc, type: reports_to }
  - { from: fed-ihra, to: fed-pims, type: regulates }
  - { from: fed-ihra, to: fed-polyclinic, type: regulates }
  - { from: fed-pims, to: fed-szabmu, type: coordinates_with, description: "Teaching hospital affiliation" }
  - { from: fed-nadra, to: fed-sehat-sahulat, type: coordinates_with, description: "Eligibility determined via NADRA and the National Socio-Economic Registry" }
  - { from: fed-bisp, to: fed-sehat-sahulat, type: coordinates_with }
  - { from: fed-nih, to: fed-neoc, type: coordinates_with, description: "Polio laboratory (WHO Regional Reference Lab) and surveillance" }
  - { from: fed-epi, to: fed-neoc, type: coordinates_with }
  - { from: fed-min-nhsrc, to: fed-cci, type: reports_to, description: "Population policy and health matters of inter-provincial importance go to the CCI" }
  - { from: fed-min-nhsrc, to: fed-min-health-former, type: successor_of }
