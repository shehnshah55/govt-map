      - { title: "Ministry of NHSR&C — Year Book 2018-19, ch. 32: National Institute of Rehabilitation Medicine", url: "https://www.nhsrc.gov.pk/SiteImage/Misc/files/Year%20Book%202018-19(3).pdf", accessed: "2026-10-21", fetched_via: direct }
  - id: fed-fgh
