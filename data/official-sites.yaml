# Official websites of public bodies (docs/EDITORIAL_POLICY.md § Official websites and Find a service).
#
# One entry per website: its homepage, the government it belongs to, a topic, what people use
# it for (English, Urdu and Roman Urdu keywords for Find a service, #/find) and the body in the graph that runs it.
# Only government domains, or hosts listed in OFFICIAL_ORG_HOSTS (src/lib/policy.ts), are allowed.
#
# status is the result of the last check (GET, following redirects, retried once):
#   verified             the homepage loaded
#   cert_issue           it loads, but the server sends an incomplete TLS certificate chain
#   verified_via_archive it did not load from outside Pakistan, but a Wayback Machine snapshot of the
#                        official homepage taken since October 2024 shows the site (archive_url)
#   unreachable_from_ci  an automated check could not load it (often: blocks networks outside
#                        Pakistan). Kept, not dropped, until checked by hand.
# The weekly freshness workflow re-checks every URL here.
