# Public services people ask about, and the bodies responsible for them.
#
# Used by Ask (#/ask) and the services directory (#/services). Each topic points to the body and to
# the official website on its record, nothing more: procedures, fees and documents change too
# often to copy here, so Ask sends people to the body's own site for them.
#
# keywords: words people use for the service, in English, Roman Urdu and Urdu. They are matched
# as whole words, with spaces and hyphens ignored ("b-form", "b form" and "bform" are the same).
# Prefer specific phrases: a bare "tax" or "bill" would catch unrelated questions.
#
# confidence: every topic starts "low" (shown as Provisional) until the link between the service
# and each body is checked against a fetched source, normally the body's own website; then add
# `sources` and raise it (docs/LAUNCH_PLAN.md §0.2). The topics below were written without network
# access to those sites and are all still provisional (docs/LAUNCH_LOG.md, 2026-10-21).
#
# The Urdu titles still need review by a native speaker before launch.

