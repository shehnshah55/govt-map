  # ── Constitutional amendments that created or changed offices ─────────────
  - { id: constitution-amendment-order-1980, title: "Constitution (Amendment) Order, 1980 (P.O. 1 of 1980)", short: "P.O. 1 of 1980", kind: amendment, year: 1980, jurisdiction: pk, needs_source: true, confidence: low, summary: "Inserted Chapter 3A, creating the Federal Shariat Court." }
  - { id: amendment-13, title: "Constitution (Thirteenth Amendment) Act, 1997", short: 13th Amendment, kind: amendment, year: 1997, jurisdiction: pk, url: "https://senate.gov.pk/uploads/documents/1658396374_410.pdf", summary: "Repealed Art. 58(2)(b), removing the President's power to dissolve the National Assembly, and returned appointment of service chiefs and Governors to the Prime Minister's advice." }
  - { id: amendment-17, title: "Constitution (Seventeenth Amendment) Act, 2003", short: 17th Amendment, kind: amendment, year: 2003, jurisdiction: pk, url: "https://senate.gov.pk/uploads/documents/1658376935_930.pdf", summary: "Restored Art. 58(2)(b) and validated the Legal Framework Order 2002, which had enlarged the National Assembly to 342 seats with 60 reserved for women." }
  - { id: amendment-19, title: "Constitution (Nineteenth Amendment) Act, 2010", short: 19th Amendment, kind: amendment, year: 2011, jurisdiction: pk, url: "https://senate.gov.pk/uploads/documents/1363147089_596.pdf", summary: "Revised the Judicial Commission and Parliamentary Committee procedure for judicial appointments after the Supreme Court's 2010 order." }
  - { id: amendment-20, title: "Constitution (Twentieth Amendment) Act, 2012", short: 20th Amendment, kind: amendment, year: 2012, jurisdiction: pk, url: "https://senate.gov.pk/uploads/documents/1358920810_923.pdf", summary: "Required caretaker governments to be appointed by consensus or through a parliamentary committee and the Election Commission." }
  - { id: amendment-21, title: "Constitution (Twenty-first Amendment) Act, 2015", short: 21st Amendment, kind: amendment, year: 2015, jurisdiction: pk, url: "https://senate.gov.pk/uploads/documents/1420804023_562.pdf", summary: "Allowed military courts to try terrorism cases for two years (extended once by the 23rd Amendment)." }
  - { id: amendment-22, title: "Constitution (Twenty-second Amendment) Act, 2016", short: 22nd Amendment, kind: amendment, year: 2016, jurisdiction: pk, url: "https://senate.gov.pk/uploads/documents/1485495334_440.pdf", summary: "Widened eligibility for Chief Election Commissioner and ECP members to senior civil servants and technocrats, not only judges." }
  - { id: army-act-1952, title: "Pakistan Army Act, 1952", kind: act, year: 1952, jurisdiction: pk, url: "https://pakistancode.gov.pk/english/UY2FqaJw1-apaUY2Fqa-apaUY2NpaZ9r-sg-jjjjjjjjjjjjj", summary: "Governs the Army; amended in 2020 and 2024 to fix the Army Chief's tenure and allow reappointment or extension." }
  - { id: army-amendment-2020, title: "Pakistan Army (Amendment) Act, 2020", kind: act, year: 2020, jurisdiction: pk, url: "https://senate.gov.pk/uploads/documents/1579178048_832.pdf", summary: "Gave the Chief of Army Staff a three-year term and allowed the Prime Minister to extend or reappoint, with the retirement age for a service chief set at 64." }
  - { id: army-amendment-2024, title: "Pakistan Army (Amendment) Act, 2024", kind: act, year: 2024, jurisdiction: pk, url: "https://senate.gov.pk/uploads/documents/1730796852_155.pdf", summary: "Raised the term of the service chiefs from three to five years (with parallel amendments to the Navy and Air Force laws)." }
  - { id: navy-ordinance-1961, title: "Pakistan Navy Ordinance, 1961", kind: ordinance, year: 1961, jurisdiction: pk, url: "https://pakistancode.gov.pk/english/UY2FqaJw1-apaUY2Fqa-apaUY2Npa5ljaA%3D%3D-sg-jjjjjjjjjjjjj" }
  - { id: air-force-act-1953, title: "Pakistan Air Force Act, 1953", kind: act, year: 1953, jurisdiction: pk, url: "https://pakistancode.gov.pk/english/UY2FqaJw1-apaUY2Fqa-apaUY2Npappn-sg-jjjjjjjjjjjjj" }
  - { id: nab-amendment-2022, title: "National Accountability (Amendment) Act, 2022", kind: act, year: 2022, jurisdiction: pk, url: "https://senate.gov.pk/uploads/documents/1655979319_406.pdf", summary: "Narrowed NAB's jurisdiction and set a three-year, non-extendable term for the Chairman." }
  - { id: nab-amendment-2026, title: "National Accountability (Amendment) Act, 2026", kind: act, year: 2026, jurisdiction: pk, url: "https://senate.gov.pk/uploads/documents/1773046916_671.pdf", summary: "Made the NAB Chairman's term extendable by another three years; passed and assented to the day before the incumbent's term was due to end." }
  - { id: sbp-amendment-2022, title: "State Bank of Pakistan (Amendment) Act, 2022", kind: act, year: 2022, jurisdiction: pk, url: "https://senate.gov.pk/uploads/documents/1644566976_915.pdf", summary: "Strengthened central-bank autonomy; Governor appointed for five years, renewable once." }
  - { id: pcaa-act-2023, title: "Pakistan Civil Aviation Act, 2023", kind: act, year: 2023, jurisdiction: pk, url: "https://pakistancode.gov.pk/english/UY2FqaJw1-apaUY2Fqa-apaUY2Npa5poZg==-sg-jjjjjjjjjjjjj", summary: "Reconstituted the Pakistan Civil Aviation Authority as the aviation regulator. Effective 9 August 2024 the old CAA was split into the PCAA, the Pakistan Airports Authority and the Bureau of Air Safety Investigation." }
