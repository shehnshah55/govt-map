# Legal instruments that establish or empower bodies in the graph.
# Constitutional provisions are referenced as { law: constitution-1973, provision: "Art. N" }.
# Pakistan Code (federal statutes): https://pakistancode.gov.pk
laws:
  # ── Constitution and amendments ────────────────────────────────────────────
  - id: constitution-1973
    title: Constitution of the Islamic Republic of Pakistan, 1973
    short: Constitution
    kind: constitution
    year: 1973
    jurisdiction: pk
    url: https://na.gov.pk/uploads/documents/1333523681_951.pdf
    summary: Supreme law of Pakistan. Establishes a federal parliamentary republic with a bicameral Majlis-e-Shoora (Parliament), four provinces, an independent judiciary and constitutional bodies such as the ECP, Auditor-General and FPSC.
  - id: amendment-8
    title: Constitution (Eighth Amendment) Act, 1985
    kind: amendment
    year: 1985
    jurisdiction: pk
    summary: Expanded presidential powers, including the (later repealed) Art. 58(2)(b) power to dissolve the National Assembly.
  - id: amendment-18
    title: Constitution (Eighteenth Amendment) Act, 2010
    short: 18th Amendment
    kind: amendment
    year: 2010
    jurisdiction: pk
    summary: Abolished the Concurrent Legislative List and devolved 17 federal ministries (including health, education, labour, population welfare and social welfare) to the provinces; strengthened the Council of Common Interests; inserted Art. 140A-backed local government obligations, Art. 175A judicial appointments and Art. 25A right to education.
  - id: amendment-25
    title: Constitution (Twenty-fifth Amendment) Act, 2018
    short: 25th Amendment
    kind: amendment
    year: 2018
    jurisdiction: pk
    summary: Merged the Federally Administered Tribal Areas (FATA) into Khyber Pakhtunkhwa.
  - id: amendment-26
    title: Constitution (Twenty-sixth Amendment) Act, 2024
    short: 26th Amendment
    kind: amendment
    year: 2024
    jurisdiction: pk
    summary: Chief Justice of Pakistan nominated by a Special Parliamentary Committee from the three most senior Supreme Court judges for a fixed three-year term; reconstituted the Judicial Commission with parliamentary members; created constitutional benches in the Supreme Court and High Courts.
  - id: amendment-27
    title: Constitution (Twenty-seventh Amendment) Act, 2025
    short: 27th Amendment
    kind: amendment
    year: 2025
    jurisdiction: pk
    confidence: medium
    summary: Created a Federal Constitutional Court to hear constitutional matters and restructured the higher military command around a Chief of Defence Forces, abolishing the office of Chairman Joint Chiefs of Staff Committee. Details should be verified against the gazetted text.

