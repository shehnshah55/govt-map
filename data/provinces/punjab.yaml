positions:
- id: pb-governor
  title: Governor of Punjab
  org: pb-governor-house
  role: head
  appointment:
    method: appointment_on_advice
    by: fed-president
    on_advice_of: fed-prime-minister
    notes: Holds office during the pleasure of the President.
    legal_basis:
    - law: constitution-1973
      provision: Art. 101
- id: pb-chief-minister
  title: Chief Minister of Punjab
  org: pb-cm-office
  role: head
  appointment:
    method: indirect_election
    by: pb-assembly
    notes: Elected by a majority of the total membership of the Provincial Assembly.
    removal: Vote of no confidence by a majority of the total membership of the Assembly (Art. 136)
    legal_basis:
    - law: constitution-1973
      provision: Art. 130(4)
- id: pb-provincial-minister
  title: Provincial Minister (Punjab)
  org: pb-cabinet
  role: member
  appointment:
    method: appointment_on_advice
    by: pb-governor
    on_advice_of: pb-chief-minister
    legal_basis:
    - law: constitution-1973
      provision: Art. 132
- id: pb-chief-secretary
  title: Chief Secretary, Punjab
  org: pb-government
  role: administrative_head
  grade: BS-22
  description: Head of the provincial civil service and secretary to the provincial cabinet. A federal PAS officer posted by the Federal Government
    in consultation with the province.
  appointment:
    method: posting
    by: fed-prime-minister
    nominated_by: fed-establishment-division
    consultation:
    - pb-chief-minister
- id: pb-igp
  title: Inspector General of Police, Punjab
  org: pb-police
  role: head
  grade: BS-21/22
  appointment:
    method: posting
    by: fed-prime-minister
    nominated_by: fed-establishment-division
    consultation:
    - pb-chief-minister
    legal_basis:
    - law: police-order-2002
- id: pb-mpa
  title: Member of the Provincial Assembly (Punjab)
  org: pb-assembly
  role: member
  seats: 371
  appointment:
    method: direct_election
    by: pk-electorate
    term: 5 years
    notes: General seats by first-past-the-post; reserved seats for women and non-Muslims by party-list proportional representation.
    legal_basis:
    - law: constitution-1973
      provision: Art. 106
    - law: elections-act-2017
