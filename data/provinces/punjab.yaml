# Province of Punjab: constitutional offices, Provincial Assembly, High Court,
# departments (Provincial Rules of Business), health vertical and links to the
# Federation. Generated once from a shared provincial template, then hand-edited —
# this file is the source of truth. Departments get generated Minister and
# Secretary posts by convention (see docs/DATA_MODEL.md).
organizations:
- id: pb-government
  name: Government of Punjab
  kind: state
  branch: executive
  description: Provincial government of Punjab. Executive authority vests in the Governor and is exercised by the Provincial Government — the
    Chief Minister and Provincial Ministers (Arts. 129–130). After the 18th Amendment, provinces are responsible for health, school education,
    agriculture, local government, police and most social services.
  legal_basis:
  - law: constitution-1973
    provision: Arts. 129–140A
  website: https://punjab.gov.pk
  sectors:
  - governance
  jurisdiction: pk-pb
- id: pb-governor-house
  name: Governor of Punjab
  short_name: Governor's House
  kind: head_of_state_office
  branch: executive
  parent: pb-government
  description: Constitutional head of the province, appointed by the President on the advice of the Prime Minister (Art. 101). Acts on the advice
    of the Cabinet or Chief Minister (Art. 105); Chancellor of public-sector universities under provincial university laws.
  legal_basis:
  - law: constitution-1973
    provision: Arts. 101–105
  jurisdiction: pk-pb
- id: pb-cm-office
  name: Chief Minister's Office, Punjab
  kind: head_of_state_office
  branch: executive
  parent: pb-government
  legal_basis:
  - law: constitution-1973
    provision: Art. 130
  jurisdiction: pk-pb
- id: pb-cabinet
  name: Provincial Cabinet of Punjab
  kind: cabinet
  branch: executive
  parent: pb-government
  description: The Chief Minister and Provincial Ministers, collectively responsible to the Provincial Assembly (Art. 130(6)). Size capped at
    15 members or 11% of the Assembly, whichever is higher (Art. 130(6)).
  legal_basis:
  - law: constitution-1973
    provision: Arts. 130, 132
  - law: punjab-rules-of-business-2011
  jurisdiction: pk-pb
- id: pb-assembly
  name: Provincial Assembly of the Punjab
  kind: legislature
  branch: legislative
  description: Unicameral provincial legislature with 371 seats (297 general, 66 women, 8 non-Muslim). Five-year term. Elects the Chief Minister
    and the province's 23 Senators, and votes in the presidential election.
  legal_basis:
  - law: constitution-1973
    provision: Art. 106
  website: https://www.pap.gov.pk
  sectors:
  - governance
  jurisdiction: pk-pb
- id: pb-assembly-pac
  name: Public Accounts Committee, Provincial Assembly of the Punjab
  kind: committee
  branch: legislative
  parent: pb-assembly
  description: Examines the Auditor-General's reports on the province's accounts (Art. 171).
  sectors:
  - accountability
  - finance
  jurisdiction: pk-pb
- id: pb-assembly-sc-health
