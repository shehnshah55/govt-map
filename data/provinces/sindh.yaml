# Province of Sindh: constitutional offices, Provincial Assembly, High Court,
# departments (Provincial Rules of Business), health vertical and links to the
# Federation. Generated once from a shared provincial template, then hand-edited —
# this file is the source of truth. Departments get generated Minister and
# Secretary posts by convention (see docs/DATA_MODEL.md).
organizations:
- id: sd-government
  name: Government of Sindh
  kind: state
  branch: executive
  description: Provincial government of Sindh. Executive authority vests in the Governor and is exercised by the Provincial Government — the Chief
    Minister and Provincial Ministers (Arts. 129–130). After the 18th Amendment, provinces are responsible for health, school education, agriculture,
    local government, police and most social services.
  legal_basis:
  - law: constitution-1973
    provision: Arts. 129–140A
  website: https://sindh.gov.pk
  sectors:
  - governance
  jurisdiction: pk-sd
- id: sd-governor-house
  name: Governor of Sindh
  short_name: Governor's House
  kind: head_of_state_office
  branch: executive
  parent: sd-government
  description: Constitutional head of the province, appointed by the President on the advice of the Prime Minister (Art. 101). Acts on the advice
    of the Cabinet or Chief Minister (Art. 105); Chancellor of public-sector universities under provincial university laws.
  legal_basis:
  - law: constitution-1973
    provision: Arts. 101–105
  jurisdiction: pk-sd
- id: sd-cm-office
  name: Chief Minister's Office, Sindh
  kind: head_of_state_office
  branch: executive
  parent: sd-government
  legal_basis:
