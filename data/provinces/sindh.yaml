    by: fed-prime-minister
    nominated_by: fed-establishment-division
    consultation:
    - sd-chief-minister
    legal_basis:
    - law: police-order-2002
- id: sd-mpa
  title: Member of the Provincial Assembly (Sindh)
  org: sd-assembly
  role: member
  seats: 168
  appointment:
