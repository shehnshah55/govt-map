    provision: Art. 130
  jurisdiction: pk-sd
- id: sd-cabinet
  name: Provincial Cabinet of Sindh
  kind: cabinet
  branch: executive
  parent: sd-government
  description: The Chief Minister and Provincial Ministers, collectively responsible to the Provincial Assembly (Art. 130(6)). Size capped at
    15 members or 11% of the Assembly, whichever is higher (Art. 130(6)).
  legal_basis:
  - law: constitution-1973
    provision: Arts. 130, 132
  - law: sindh-rules-of-business-1986
  jurisdiction: pk-sd
- id: sd-assembly
  name: Provincial Assembly of Sindh
  kind: legislature
  branch: legislative
  description: Unicameral provincial legislature with 168 seats (130 general, 29 women, 9 non-Muslim). Five-year term. Elects the Chief Minister
    and the province's 23 Senators, and votes in the presidential election.
  legal_basis:
  - law: constitution-1973
    provision: Art. 106
  website: https://www.pas.gov.pk
  sectors:
  - governance
  jurisdiction: pk-sd
- id: sd-assembly-pac
