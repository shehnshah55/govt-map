    provision: Art. 130
  jurisdiction: pk-kp
- id: kp-cabinet
  name: Provincial Cabinet of Khyber Pakhtunkhwa
  kind: cabinet
  branch: executive
  parent: kp-government
  description: The Chief Minister and Provincial Ministers, collectively responsible to the Provincial Assembly (Art. 130(6)). Size capped at
    15 members or 11% of the Assembly, whichever is higher (Art. 130(6)).
  legal_basis:
  - law: constitution-1973
    provision: Arts. 130, 132
  - law: kp-rules-of-business-1985
  jurisdiction: pk-kp
- id: kp-assembly
  name: Provincial Assembly of Khyber Pakhtunkhwa
  kind: legislature
  branch: legislative
  description: Unicameral provincial legislature with 145 seats (115 general, 26 women, 4 non-Muslim (after FATA merger)). Five-year term. Elects
    the Chief Minister and the province's 23 Senators, and votes in the presidential election.
  legal_basis:
  - law: constitution-1973
    provision: Art. 106
  website: https://www.pakp.gov.pk
  sectors:
  - governance
  jurisdiction: pk-kp
