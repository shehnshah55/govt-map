positions:
- id: ba-governor
  title: Governor of Balochistan
  org: ba-governor-house
  role: head
  appointment:
    method: appointment_on_advice
    by: fed-president
    on_advice_of: fed-prime-minister
    notes: Holds office during the pleasure of the President.
    legal_basis:
    - law: constitution-1973
      provision: Art. 101
- id: ba-chief-minister
  title: Chief Minister of Balochistan
  org: ba-cm-office
  role: head
  appointment:
    method: indirect_election
    by: ba-assembly
    notes: Elected by a majority of the total membership of the Provincial Assembly.
    removal: Vote of no confidence by a majority of the total membership of the Assembly (Art. 136)
    legal_basis:
    - law: constitution-1973
      provision: Art. 130(4)
- id: ba-provincial-minister
  title: Provincial Minister (Balochistan)
  org: ba-cabinet
  role: member
  appointment:
    method: appointment_on_advice
    by: ba-governor
    on_advice_of: ba-chief-minister
    legal_basis:
    - law: constitution-1973
      provision: Art. 132
- id: ba-chief-secretary
  title: Chief Secretary, Balochistan
  org: ba-government
  role: administrative_head
  grade: BS-22
  description: Head of the provincial civil service and secretary to the provincial cabinet. A federal PAS officer posted by the Federal Government
    in consultation with the province.
  appointment:
    method: posting
    by: fed-prime-minister
    nominated_by: fed-establishment-division
    consultation:
    - ba-chief-minister
- id: ba-igp
  title: Inspector General of Police, Balochistan
  org: ba-police
  role: head
  grade: BS-21/22
  appointment:
    method: posting
    by: fed-prime-minister
    nominated_by: fed-establishment-division
    consultation:
    - ba-chief-minister
    legal_basis:
    - law: police-order-2002
- id: ba-mpa
  title: Member of the Provincial Assembly (Balochistan)
  org: ba-assembly
  role: member
  seats: 65
  appointment:
    method: direct_election
    by: pk-electorate
    term: 5 years
    notes: General seats by first-past-the-post; reserved seats for women and non-Muslims by party-list proportional representation.
    legal_basis:
    - law: constitution-1973
      provision: Art. 106
    - law: elections-act-2017
