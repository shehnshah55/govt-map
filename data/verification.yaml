    checked: "2026-09-25"
    sources:
      - { title: "Pakistan Today — Post of CJCSC stands abolished", url: "https://www.pakistantoday.com.pk/2025/11/28/post-of-cjcsc-stands-abolished-as-chief-of-defence-forces-era-begins-under-27th-amend/" }
