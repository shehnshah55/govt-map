    origin: spreadsheet INC-011, DEF-JCSC-01, POS-019
    status: corrected
    finding: The CJCSC office was abolished by the 27th Amendment on General Mirza's retirement on 27 November 2025. The tri-service head is now the Chief of Defence Forces, Field Marshal Asim Munir (from 5 December 2025).
    records: [fed-cdf, asim-munir]
    checked: "2026-09-25"
    sources:
      - { title: "Pakistan Today — Post of CJCSC stands abolished", url: "https://www.pakistantoday.com.pk/2025/11/28/post-of-cjcsc-stands-abolished-as-chief-of-defence-forces-era-begins-under-27th-amend/" }
