  - claim: "Law titles and years (law records without a link to their text)"
    origin: sourcing sweep
    status: corrected
    finding: "Each law now links to its official text: Pakistan Code for federal law, the Senate's register of Acts (Gazette copies) for constitutional and other amending Acts, and the KP Code, Sindh Laws (Gazette), Balochistan Assembly and Balochistan Code sites for provincial law. Titles and years were corrected to match those texts. The Nineteenth Amendment is titled the Constitution (Nineteenth Amendment) Act, 2010 (Act I of 2011). The 2026 NAB amendment is the National Accountability (Amendment) Act, 2026. The nursing council law is the Pakistan Nursing and Midwifery Council Act, 2026; no 2023 Act appears on Pakistan Code. The Pakistan Engineering Council Act is dated 1975, not 1976. The National Institute of Health Ordinance, 1980 was repealed by the National Institute of Health (Re-organization) Act, 2021 (w.e.f. 29 July 2021), so the record now points to the 2021 Act. The ICT real-estate law is the Islamabad Real Estate (Regulation and Development) Act, 2020. The merchant shipping law is the Pakistan Merchant Shipping Ordinance, 2001. The mines law reads '(Federal Control)'. The KP Code titles the food law the Khyber Pakhtunkhwa Food Safety Authority Act, 2014; it establishes the Food Safety and Halal Food Authority. The Sehat Card law is the Khyber Pakhtunkhwa Universal Health Coverage Act, 2022. The Sindh Gazette lists the Sindh Healthcare Commission Act as Act VII of 2014 (20 March 2014), not 2013. The Balochistan Code lists the Balochistan ombudsman law as an Ordinance of 2001, not an Act."
