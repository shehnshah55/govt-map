  - claim: "Map of Pakistan"
    status: corrected
    finding: "The map previously used Natural Earth's de facto borders, which place Indian Illegally Occupied Jammu & Kashmir inside India. It now follows the Government of Pakistan's official political map of 4 August 2020: IIOJK is shown as disputed territory whose final status is to be decided in line with the relevant UNSC resolutions, the frontier east of Ladakh is undefined, Junagadh and Manavadar are shown as Pakistani territory, and the Sir Creek boundary is on the eastern bank."
    checked: "2026-09-25"
    sources:
      - { title: "Dawn — PM unveils 'new political map' of Pakistan", url: "https://www.dawn.com/news/1572590" }
