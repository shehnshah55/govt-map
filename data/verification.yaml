# Verification log. Every entry records a claim, the records it touches, what
# the check found, and the sources used. Claims from the uploaded spreadsheet
# ("Pakistan_Government_Structure_and_Officials.xlsx") are marked with origin.
# Status: verified | corrected (our data or the source was wrong and is fixed)
#         | conflict (sources disagree; both shown) | unverified (no reliable source found yet)
verification:
  - claim: "Chairman Joint Chiefs of Staff Committee is General Sahir Shamshad Mirza (Nov 2022 – present)"
    origin: spreadsheet INC-011, DEF-JCSC-01, POS-019
    status: corrected
    finding: The CJCSC office was abolished by the 27th Amendment on General Mirza's retirement on 27 November 2025. The tri-service head is now the Chief of Defence Forces, Field Marshal Asim Munir (from 5 December 2025).
    records: [fed-cdf, asim-munir]
    checked: "2026-09-25"
    sources:
      - { title: "Pakistan Today — Post of CJCSC stands abolished", url: "https://www.pakistantoday.com.pk/2025/11/28/post-of-cjcsc-stands-abolished-as-chief-of-defence-forces-era-begins-under-27th-amend/" }
      - { title: "Arab News — President appoints first Chief of Defence Forces", url: "https://www.arabnews.com/node/2625012/pakistan" }
  - claim: "Chief Minister of Khyber Pakhtunkhwa is Ali Amin Gandapur (2024 – present)"
    origin: spreadsheet INC-017
    status: corrected
    finding: Gandapur served March 2024 – October 2025. Muhammad Sohail Afridi was elected Chief Minister on 13 October 2025.
    records: [kp-chief-minister, sohail-afridi, ali-amin-gandapur]
    checked: "2026-09-25"
    sources: [{ title: "Dawn — KP CM Sohail Afridi's cabinet takes oath", url: "https://www.dawn.com/news/1952295" }]
  - claim: "Chief of Army Staff is General Asim Munir (Nov 2022 – present)"
    origin: spreadsheet INC-010
    status: corrected
    finding: Still COAS, but now Field Marshal (May 2025) and concurrently the first Chief of Defence Forces, with a fresh five-year term to 2030.
    records: [fed-coas, fed-cdf, asim-munir]
    checked: "2026-09-25"
    sources: [{ title: "Arab News — Army chief gets fresh five-year term", url: "https://www.arabnews.com/node/2622517/pakistan" }]
  - claim: "Chairman NAB is appointed by the Federal Government"
    origin: spreadsheet POS-018
    status: corrected
    finding: Under s. 6 of the NAB Ordinance as amended in 2022, the President appoints the Chairman after consultation between the Prime Minister and the Leader of the Opposition. The 2026 amendment made the three-year term extendable, and the incumbent was extended to March 2029.
    records: [fed-nab-chairman, nazir-ahmed-butt]
    checked: "2026-09-25"
    sources: [{ title: "Dawn — President assents to bill extending NAB chairman's term", url: "https://www.dawn.com/news/1978688" }]
  - claim: "PCAA is established by the Civil Aviation Authority Act 2023, headquartered in Karachi"
    origin: spreadsheet REG-AVN-01
    status: corrected
    finding: The law is the Pakistan Civil Aviation Act, 2023. From 9 August 2024 the old CAA was split into the PCAA (regulator), Pakistan Airports Authority and Bureau of Air Safety Investigation. The old CAA was headquartered at Karachi airport; the restructured PCAA's headquarters could not be confirmed, so no HQ is recorded.
    records: [fed-caa, fed-paa, fed-basi, pcaa-act-2023]
    checked: "2026-09-25"
    sources:
      - { title: "Pakistan Code — Pakistan Civil Aviation Act, 2023", url: "https://pakistancode.gov.pk/english/UY2FqaJw1-apaUY2Fqa-apaUY2Npa5poZg==-sg-jjjjjjjjjjjjj" }
      - { title: "Geo — Govt splits PCAA into three bodies", url: "https://www.geo.tv/latest/558953-govt-splits-pcaa-into-three-bodies" }
