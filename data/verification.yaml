    checked: "2026-09-25"
    sources: [{ title: "Dawn — President assents to bill extending NAB chairman's term", url: "https://www.dawn.com/news/1978688" }]
  - claim: "PCAA is established by the Civil Aviation Authority Act 2023, headquartered in Karachi"
    origin: spreadsheet REG-AVN-01
    status: corrected
    finding: The law is the Pakistan Civil Aviation Act, 2023. From 9 August 2024 the old CAA was split into the PCAA (regulator), Pakistan Airports Authority and Bureau of Air Safety Investigation. The old CAA was headquartered at Karachi airport; the restructured PCAA's headquarters could not be confirmed, so no HQ is recorded.
    records: [fed-caa, fed-paa, fed-basi, pcaa-act-2023]
    checked: "2026-09-25"
    sources:
      - { title: "Pakistan Code — Pakistan Civil Aviation Act, 2023", url: "https://pakistancode.gov.pk/english/UY2FqaJw1-apaUY2Fqa-apaUY2Npa5poZg==-sg-jjjjjjjjjjjjj" }
