name: CI
on:
  pull_request:
  push:
    branches: [main]
# Read-only: CI never writes to the repository.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependencies have no high or critical advisories
        run: npm audit --audit-level=high
      - run: npm run validate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:single
      - name: Built pages carry the CSP and load nothing from other sites
        run: npm run check:build
      - name: Coverage report is up to date
        run: npm run audit:coverage -- --check
  browser:
    # Browser smoke tests (e2e/smoke.spec.ts): every page type at 1280 and 375 px, with no
    # console errors, failed requests or sideways scrolling, and no serious or critical axe findings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run build
      - name: Use the runner's Chrome (no browser download)
        run: echo "CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      - run: test -x "$CHROME_PATH" && "$CHROME_PATH" --version
      - run: npm run test:e2e
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-tests
          path: |
            playwright-report/
            test-results/
          retention-days: 14
