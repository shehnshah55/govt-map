name: CI
on:
  pull_request:
  push:
    branches: [main]
# Read-only: CI never writes to the repository.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependencies have no high or critical advisories
        run: npm audit --audit-level=high
      - run: npm run validate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:single
      - name: Built pages carry the CSP and load nothing from other sites
        run: npm run check:build
      - name: Coverage report is up to date
        run: npm run audit:coverage -- --check
