name: CI
on:
  pull_request:
  push:
    branches: [main]
# Read-only: CI never writes to the repository.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependencies have no high or critical advisories
        run: npm audit --audit-level=high
      - run: npm run validate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:single
      - name: Built pages carry the CSP and load nothing from other sites
        run: npm run check:build
      - name: Coverage report is up to date
        run: npm run audit:coverage -- --check
