# Publishes the site to GitHub Pages. Enable Pages (Settings → Pages → Source: GitHub Actions) first.
name: Deploy site
on:
  workflow_dispatch:
  push:
    branches: [main]
# Nothing at workflow level; each job asks for only what it needs.
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code
      pages: write # publish to GitHub Pages
      id-token: write # prove the deployment's origin to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Built page carries the CSP and loads nothing from other sites
        run: npx tsx scripts/check-build.ts dist/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
