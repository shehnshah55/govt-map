# Weekly dependency updates, grouped so each ecosystem opens at most one PR a week.
# Security updates are separate and immediate once Dependabot alerts are enabled in Settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
