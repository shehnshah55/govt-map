name: Bug
description: The site or the build doesn't work as it should.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: For a wrong fact, use **Correction request** instead. For a security problem, see SECURITY.md and report it privately.
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page where it happens.
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For example "Chrome 130 on Android" or "Safari on iPhone".
    validations:
      required: false
